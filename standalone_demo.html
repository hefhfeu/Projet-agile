    function App() {
      const [data, setData] = useState(INITIAL_DATA);
      const [currentUser, setCurrentUser] = useState(INITIAL_DATA.users[0]); // Par défaut Administrateur
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const [slideOver, setSlideOver] = useState(null); // 'maintenance', 'incident', 'lot'

      // Filtre de calcul BOM interactif
      const [bomMultiplier, setBomMultiplier] = useState(1);

      // État formulaire tactile maintenance
      const [maintMachine, setMaintMachine] = useState(data.machines[2]?.referenceMachine || "ROBOT-ASS-03");
      const [maintPiece, setMaintPiece] = useState(data.pieces[0]?.referencePiece || "PIECE-SKF-6205");
      const [maintQte, setMaintQte] = useState(1);
      const [maintOp, setMaintOp] = useState(data.operateurs[0]?.matricule || "OP-001");
      const [maintDuree, setMaintDuree] = useState(60);

      // Notification toast
      const notify = (title, desc, type = 'success') => {
        setToast({ title, desc, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Règle critique : Décrémentation atomique lors de la maintenance
      const handleExecuteMaintenance = (e) => {
        e.preventDefault();
        const piece = data.pieces.find(p => p.referencePiece === maintPiece);
        if (piece && piece.quantiteStock < maintQte) {
          notify("Stock Insuffisant", `Seulement ${piece.quantiteStock} pièces disponibles pour ${maintPiece}.`, "error");
          return;
        }

        const opObj = data.operateurs.find(o => o.matricule === maintOp);
        const machObj = data.machines.find(m => m.referenceMachine === maintMachine);

        setData(prev => ({
          ...prev,
          pieces: prev.pieces.map(p => p.referencePiece === maintPiece ? { ...p, quantiteStock: p.quantiteStock - maintQte } : p),
          maintenances: [{
            id: Date.now(),
            machine_ref: maintMachine,
            ligne_numero: machObj ? machObj.numero_ligne : 101,
            dateDebut: new Date().toISOString().split('T')[0],
            heureDebut: new Date().toTimeString().split(' ')[0].substring(0, 5),
            duree: `0${Math.floor(maintDuree / 60)}:${(maintDuree % 60).toString().padStart(2, '0')}:00`,
            operateurs: [opObj ? `${opObj.matricule} (${opObj.prenom} ${opObj.nom})` : maintOp],
            consommations: [{ piece_ref: maintPiece, quantite: maintQte, libelle: piece ? piece.libelle : maintPiece }]
          }, ...prev.maintenances]
        }));

        setSlideOver(null);
        notify("Maintenance Validée", `Stock de ${maintPiece} réduit de ${maintQte} unités.`);
      };

      // Règle critique : Déclaration Incident avec relevé obligatoire du temps d'arrêt
      const handleCreateIncident = (e) => {
        e.preventDefault();
        const numInc = parseInt(e.target.num.value, 10);
        const idLot = parseInt(e.target.lot.value, 10);
        const tpsMin = parseInt(e.target.tps.value, 10);
        const typeLib = e.target.type.value;

        setData(prev => ({
          ...prev,
          incidents: [{
            id: Date.now(),
            numeroIncident: numInc,
            idLot: idLot,
            produit_ref: "LOT-" + idLot,
            type_libelle: typeLib,
            tempsArret: `00:${tpsMin.toString().padStart(2, '0')}:00`,
            temps_minutes: tpsMin
          }, ...prev.incidents],
          lots: prev.lots.map(l => l.idLot === idLot ? { ...l, nb_incidents: (l.nb_incidents || 0) + 1 } : l)
        }));

        setSlideOver(null);
        notify("Incident Enregistré", `Arrêt de ${tpsMin} min consigné sur le Lot #${idLot}.`, "warning");
      };

      // Création d'atelier et ligne
      const handleCreateAtelier = (e) => {
        e.preventDefault();
        const num = parseInt(e.target.num.value, 10);
        const lib = e.target.lib.value.trim();
        const numLigne = parseInt(e.target.ligne.value, 10);
        const nbOp = parseInt(e.target.nbop.value, 10);

        const newAtelier = {
          id: Date.now(),
          numeroAtelier: num,
          libelle: lib,
          responsable_nom: "Michel Martin",
          lignes: [
            { id: Date.now() + 1, numeroLigne: numLigne, nbOperateursNecessaires: nbOp, machines_count: 1, statut: "EN_COURS", lot_actuel: "En attente", produit_nom: "Planifié", progress: 0 }
          ]
        };

        setData(prev => ({
          ...prev,
          ateliers: [...prev.ateliers, newAtelier]
        }));
        setSlideOver(null);
        notify("Atelier Créé", `Atelier #${num} et Ligne #${numLigne} configurés.`);
      };

      // Lancement d'un nouveau lot de production
      const handleCreateLot = (e) => {
        e.preventDefault();
        const numLot = parseInt(e.target.num.value, 10);
        const ligneNum = parseInt(e.target.ligne.value, 10);
        const prodRef = e.target.prod.value;
        const prodObj = data.produits.find(p => p.referenceProduit === prodRef);

        const newLot = {
          id: Date.now(),
          idLot: numLot,
          dateProduction: new Date().toISOString().split('T')[0],
          ligne_numero: ligneNum,
          produit_ref: prodRef,
          produit_nom: prodObj ? prodObj.designation : prodRef,
          operateurs: ["OP-001 (Thomas Bernard)", "OP-002 (Sophie Leroy)"],
          nb_incidents: 0,
          statut: "Actif"
        };

        setData(prev => ({
          ...prev,
          lots: [newLot, ...prev.lots]
        }));
        setSlideOver(null);
        notify("Lot Lancé", `Lot #${numLot} démarré sur la Ligne ${ligneNum}.`);
      };

      // Création produit fini
      const handleCreateProduit = (e) => {
        e.preventDefault();
        const ref = e.target.ref.value.trim().toUpperCase();
        const nom = e.target.nom.value.trim();
        const prix = parseFloat(e.target.prix.value);
        const stock = parseInt(e.target.stock.value, 10);

        setData(prev => ({
          ...prev,
          produits: [...prev.produits, {

                      + Nouveau Produit
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {data.produits.map(p => (
                      <div key={p.id} className="glass-card p-5 rounded-2xl border border-slate-800 space-y-4">
                        <span className="font-mono text-xs font-bold text-indigo-400 px-2 py-0.5 bg-indigo-500/10 rounded border border-indigo-500/20">
                          {p.referenceProduit}
                        </span>
                        <h4 className="font-bold text-base text-white">{p.designation}</h4>
                        <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs font-mono">
                          <span className="text-slate-400">Prix unitaire</span>
                          <span className="text-emerald-400 font-bold text-sm">{p.prixVenteUnitaire.toFixed(2)} €</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'equipes' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                    <div>
                      <h2 className="text-2xl font-extrabold text-white">Équipes & Opérateurs</h2>
                      <p className="text-xs text-slate-400 mt-1">Affectation unique des ouvriers par équipe sous la supervision d'un collaborateur responsable.</p>
                    </div>
                    <button
                      onClick={() => setSlideOver('operateur')}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-600/30 transition"
                    >
                      + Ajouter Opérateur
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {data.equipes.map(eq => (
                      <div key={eq.id} className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                          <div>
                            <span className="font-mono text-xs font-bold text-emerald-400">Équipe #{eq.numeroEquipe}</span>
                            <h3 className="font-bold text-white text-base">{eq.libelle}</h3>
                            <div className="text-xs text-slate-400">Responsable : {eq.responsable_nom}</div>
                          </div>
                        </div>
                        <div className="space-y-2">
                          {data.operateurs.filter(o => o.equipe_id === eq.id).map(op => (
                            <div key={op.matricule} className="p-3 bg-surface-900 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                              <span className="font-mono font-bold text-indigo-400">{op.matricule}</span>
                              <span className="text-slate-200 font-medium">{op.prenom} {op.nom}</span>
                              <span className="text-slate-400 font-mono text-[10px]">Entrée: {op.dateEntree}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* TIROIR LATÉRAL COULISSANT (SLIDE-OVER / FAST-INPUT TACTILE TABLETTE) */}
          {slideOver && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-slate-950/70 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-surface-900 border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl animate-in slide-in-from-right duration-300">

                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                    <h3 className="text-lg font-bold text-white flex items-center space-x-2">
                      <span>
                        {slideOver === 'maintenance' ? '🔧' :
                          slideOver === 'incident' ? '⚠️' :
                            slideOver === 'atelier' ? '🏭' :
                              slideOver === 'lot' ? '📦' :
                                slideOver === 'produit' ? '🏷️' : '👤'}
                      </span>
                      <span>
                        {slideOver === 'maintenance' ? 'Saisie Tactile Maintenance' :
                          slideOver === 'incident' ? 'Déclaration Incident & Arrêt' :
                            slideOver === 'atelier' ? 'Créer un Atelier & Ligne' :
                              slideOver === 'lot' ? 'Lancer un Nouveau Lot' :
                                slideOver === 'produit' ? 'Enregistrer un Produit' : 'Ajouter un Opérateur'}
                      </span>
                    </h3>
                    <button
                      onClick={() => setSlideOver(null)}
                      className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800"
                    >✕</button>
                  </div>

                  {slideOver === 'maintenance' && (
                    <form onSubmit={handleExecuteMaintenance} className="space-y-5">

                      {/* Choix Machine (Gros boutons tactiles) */}
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">Machine ciblée</label>
                        <select
                          value={maintMachine}
                          onChange={e => setMaintMachine(e.target.value)}
                          className="w-full h-12 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono outline-none focus:border-indigo-500"
                        >
                          {data.machines.map(m => (
                            <option key={m.id} value={m.referenceMachine}>{m.referenceMachine} — Ligne {m.numero_ligne}</option>
                          ))}
                        </select>
                      </div>

                      {/* Pièce consommée */}
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">Pièce de rechange</label>
                        <select
                          value={maintPiece}
                          onChange={e => setMaintPiece(e.target.value)}
                          className="w-full h-12 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono outline-none focus:border-indigo-500"
                        >
                          {data.pieces.map(p => (
                            <option key={p.id} value={p.referencePiece}>{p.referencePiece} (Stock: {p.quantiteStock})</option>
                          ))}
                        </select>
                      </div>

                      {/* Sélecteur tactile + / - pour la quantité consommée */}
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">Quantité consommée (Décrémentation)</label>
                        <div className="flex items-center space-x-3">
                          <button
                            type="button"
                            onClick={() => setMaintQte(Math.max(1, maintQte - 1))}
                            className="w-14 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-lg flex items-center justify-center border border-slate-700"
                          >-</button>
                          <div className="flex-1 h-12 bg-surface-850 border border-slate-700 rounded-xl flex items-center justify-center font-mono font-extrabold text-xl text-amber-400">
                            {maintQte}
                          </div>
                          <button
                            type="button"
                            onClick={() => setMaintQte(maintQte + 1)}
                            className="w-14 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-lg flex items-center justify-center border border-slate-700"
                          >+</button>
                        </div>
                      </div>

                      {/* Technicien */}
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">Opérateur intervenant</label>
                        <div className="grid grid-cols-2 gap-2">
                          {data.operateurs.slice(0, 4).map(op => (
                            <button
                              key={op.matricule}
                              type="button"
                              onClick={() => setMaintOp(op.matricule)}
                              className={`h-11 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center border ${maintOp === op.matricule
                                  ? 'bg-indigo-600 text-white border-indigo-500'
                                  : 'bg-surface-850 text-slate-300 border-slate-700 hover:bg-slate-800'
                                }`}
                            >
                              {op.matricule} ({op.prenom})
                            </button>
                          ))}
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full h-14 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold text-sm rounded-xl shadow-xl shadow-amber-500/20 transition transform active:scale-95 mt-4"
                      >
                        Valider la Décrémentation Stock
                      </button>

                    </form>
                  )}

                  {slideOver === 'incident' && (
                    <form onSubmit={handleCreateIncident} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">N° Incident</label>
                        <input name="num" type="number" defaultValue="503" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Lot impacté</label>
                        <select name="lot" className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono">
                          {data.lots.map(l => <option key={l.id} value={l.idLot}>Lot #{l.idLot} ({l.produit_nom})</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Typologie de Panne</label>
                        <select name="type" className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white">
                          {data.typesIncidents.map(t => <option key={t.id} value={t.libelle}>[{t.codeType}] {t.libelle}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Temps d'arrêt (minutes)</label>
                        <input name="tps" type="number" defaultValue="40" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                      </div>
                      <button
                        type="submit"
                        className="w-full h-12 bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-rose-600/30 transition mt-4"
                      >
                        Consigner l'Arrêt
                      </button>
                    </form>
                  )}

                  {slideOver === 'atelier' && (
                    <form onSubmit={handleCreateAtelier} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Numéro d'Atelier</label>
                        <input name="num" type="number" defaultValue="30" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Libellé de l'Atelier</label>
                        <input name="lib" type="text" defaultValue="Atelier Peinture & Finitions" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">1ère Ligne (Numéro)</label>
                          <input name="ligne" type="number" defaultValue="301" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                        </div>
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">Effectif Requis (Op.)</label>
                          <input name="nbop" type="number" defaultValue="3" min="1" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full h-12 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition mt-4"
                      >
                        Enregistrer l'Atelier & Ligne
                      </button>
                    </form>
                  )}

                  {slideOver === 'lot' && (
                    <form onSubmit={handleCreateLot} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Numéro de Lot</label>
                        <input name="num" type="number" defaultValue="1003" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Ligne de fabrication</label>
                        <select name="ligne" className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono">
                          {data.ateliers.flatMap(a => a.lignes).map(l => (
                            <option key={l.id} value={l.numeroLigne}>Ligne #{l.numeroLigne} ({l.nbOperateursNecessaires} op. requis)</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Produit à fabriquer</label>
                        <select name="prod" className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white">
                          {data.produits.map(p => (
                            <option key={p.id} value={p.referenceProduit}>{p.referenceProduit} — {p.designation}</option>
                          ))}
                        </select>
                      </div>
                      <div className="p-3 bg-surface-850 rounded-xl border border-slate-700/60 text-xs text-slate-300">
                        <span className="font-semibold block mb-1">Ouvriers affectés d'office :</span>
                        <div className="font-mono text-indigo-400">OP-001 (Thomas Bernard), OP-002 (Sophie Leroy)</div>
                      </div>
                      <button
                        type="submit"
                        className="w-full h-12 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition mt-4"
                      >
                        Lancer le Lot de Production
                      </button>
                    </form>
                  )}

                  {slideOver === 'produit' && (
                    <form onSubmit={handleCreateProduit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Référence Produit</label>
                        <input name="ref" type="text" defaultValue="VARIAT-400V" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono uppercase" />
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Désignation</label>
                        <input name="nom" type="text" defaultValue="Variateur de Fréquence Industriel 400V" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">Prix Unitaire (€)</label>
                          <input name="prix" type="number" step="0.01" defaultValue="730.00" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                        </div>
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">Stock Initial</label>
                          <input name="stock" type="number" defaultValue="12" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono" />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full h-12 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition mt-4"
                      >
                        Enregistrer au Catalogue
                      </button>
                    </form>
                  )}

                  {slideOver === 'operateur' && (
                    <form onSubmit={handleCreateOperateur} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Matricule Unique</label>
                        <input name="mat" type="text" defaultValue="OP-005" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white font-mono uppercase" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">Prénom</label>
                          <input name="prenom" type="text" defaultValue="Alexandre" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white" />
                        </div>
                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1">Nom</label>
                          <input name="nom" type="text" defaultValue="Rousseau" required className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1">Équipe d'affectation unique</label>
                        <select name="eq" className="w-full h-11 bg-surface-850 border border-slate-700 rounded-xl px-3 text-sm text-white">
                          {data.equipes.map(eq => (
                            <option key={eq.id} value={eq.id}>Équipe #{eq.numeroEquipe} — {eq.libelle}</option>
                          ))}
                        </select>
                      </div>
                      <button
                        type="submit"
                        className="w-full h-12 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition mt-4"
                      >
                        Affecter à l'Équipe
                      </button>
                    </form>
                  )}

                </div>

                <div className="text-[11px] text-slate-400 font-mono text-center pt-4 border-t border-slate-800">
                  Règles métier validées en temps réel
                </div>

              </div>
            </div>
          )}

          {/* TOAST MODERNE TYPE SONNER */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-3 bg-surface-900 border border-slate-700 text-white px-4 py-3.5 rounded-2xl shadow-2xl animate-in slide-in-from-bottom duration-300">
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold ${toast.type === 'error' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                  toast.type === 'warning' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                    'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                }`}>
                {toast.type === 'error' ? '✕' : toast.type === 'warning' ? '⚠️' : '✓'}
              </div>
              <div>
                <div className="text-xs font-bold text-white">{toast.title}</div>
                <div className="text-[11px] text-slate-400">{toast.desc}</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
